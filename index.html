<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b0f16" />
    <meta name="description" content="Plataforma financeira pessoal. Seus dados ficam no seu navegador." />
    <title>Finanças</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111827'/%3E%3Cpath d='M9 21V11h6.2a3.4 3.4 0 0 1 0 6.8H12' stroke='%2334d399' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M7.5 14.5h9M7.5 18h6' stroke='%2334d399' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <script>
      // A preferência de tema vive no IndexedDB, que é assíncrono. Uma cópia
      // no localStorage permite aplicar o tema ANTES da primeira pintura e
      // evitar o clarão branco de quem escolheu o tema escuro.
      try {
        var t = localStorage.getItem('financas:theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        /* navegador com armazenamento bloqueado: segue a preferência do sistema */
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
