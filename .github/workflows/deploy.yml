name: Testes e publicação

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verificar:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # As regras financeiras são conferidas a cada mudança. Se algum teste
      # cair, nada é publicado.
      - name: Testes das regras financeiras
        run: npm test

      - name: Build
        run: npm run build
        env:
          # O GitHub Pages serve o site em /<nome-do-repositorio>/
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      # Publica a partir da branch PADRÃO do repositório, seja ela qual for.
      # Fixar "main" quebraria neste repositório, cuja branch padrão tem outro
      # nome — e voltaria a quebrar se ela fosse renomeada.
      - name: Guardar o site
        if: github.ref_name == github.event.repository.default_branch && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    name: Publicar no GitHub Pages
    needs: verificar
    if: github.ref_name == github.event.repository.default_branch && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Ligar o Pages tem de ser feito uma vez, à mão, em
      # Settings → Pages → Build and deployment → Source → GitHub Actions.
      # Automatizar não é possível: o token padrão do Actions tem permissão de
      # escrita no Pages, mas não de CRIAR o site — isso exige direitos de
      # admin, que ele não tem ("Resource not accessible by integration").
      - id: deploy
        uses: actions/deploy-pages@v4
